# Docker Compose 专用的前端 Nginx 配置。
# 与 web/nginx.conf（K8s，反代到 aiops-api.aiops.svc.cluster.local）区分：
# 这里反代到同一 compose 网络内的后端服务名 `api`。
server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 入口 HTML 不缓存：每次发布后浏览器必须拿最新的资源引用，
  # 避免旧 HTML 继续指向已不存在的 hash 资源或展示旧版本页面。
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://api:8080/api/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Origin "";
  }

  location = /healthz {
    proxy_pass http://api:8080/healthz;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /readyz {
    proxy_pass http://api:8080/readyz;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /version {
    proxy_pass http://api:8080/version;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}