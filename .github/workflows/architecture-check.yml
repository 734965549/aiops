name: architecture-check

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  file-sizes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test architecture checker
        run: python -B -m unittest discover -s scripts/tests -p "test_architecture_guard.py"
      - name: Check architecture file sizes and debt baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python scripts/check_architecture.py --base-ref "$BASE_SHA"
          else
            python scripts/check_architecture.py
          fi
